<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Animación festiva del Día de las Flores Amarillas" />
  <title>¡Feliz Día de las Flores Amarillas!</title>

  <!-- Fuente amigable, elegante y festiva de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold-deep: #D48806;
      --gold-vivid: #FADB14;
      --gold-light: #FFF566;
      --green-leaf: #389E0D;
      --green-stem: #237804;
      --warm-bg-start: #FFFBE6;
      --warm-bg-end: #FFE58F;
      --night-start: #0b1230;
      --night-mid: #17235c;
      --night-glow: #3b4ea3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f0d05;
      font-family: 'Quicksand', sans-serif;
    }

    /* Contenedor Principal */
    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Fondo Bokeh Suave (fase inicial) */
    .bokeh-bg {
      position: absolute;
      inset: -50px;
      background: radial-gradient(circle at 50% 50%, #442a04 0%, #1a1403 60%, #070601 100%);
      filter: blur(40px);
      z-index: 1;
      transition: opacity 3s ease;
    }

    /* Fondo de Prado Soleado (Fase 2, de día) */
    .meadow-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #ffffff 0%, var(--warm-bg-start) 40%, var(--warm-bg-end) 100%);
      opacity: 0;
      z-index: 2;
      transition: opacity 2.5s ease-in-out;
    }

    /* Fondo Nocturno (Fase 3, cuando inicia la música) */
    .night-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 25%, var(--night-glow) 0%, var(--night-mid) 45%, var(--night-start) 100%);
      opacity: 0;
      z-index: 2;
      transition: opacity 3.5s ease-in-out;
      pointer-events: none;
    }

    .night-bg.active {
      opacity: 1;
    }

    /* Velo oscuro que se posa sobre el prado al caer la noche */
    .night-veil {
      position: absolute;
      inset: 0;
      background: rgba(11, 18, 48, 0.55);
      opacity: 0;
      z-index: 4;
      transition: opacity 3.5s ease-in-out;
      pointer-events: none;
    }

    .night-veil.active {
      opacity: 1;
    }

    /* Estrellas */
    .stars {
      position: absolute;
      inset: 0;
      z-index: 3;
      opacity: 0;
      transition: opacity 3s ease-in-out 0.5s;
      pointer-events: none;
    }

    .stars.active {
      opacity: 1;
    }

    .star {
      position: absolute;
      border-radius: 50%;
      background: #fffef2;
      animation: twinkle 3s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.25; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    /* Luna */
    .moon {
      position: absolute;
      top: 8%;
      right: 12%;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fffdf0 0%, #fff3c4 55%, #ffe58f 100%);
      box-shadow: 0 0 60px 20px rgba(255, 245, 200, 0.45);
      z-index: 3;
      opacity: 0;
      transition: opacity 3s ease-in-out 0.8s, transform 3s ease-in-out 0.8s;
      transform: translateY(-30px);
      pointer-events: none;
    }

    .moon.active {
      opacity: 1;
      transform: translateY(0);
    }

    .moon::before {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(212, 136, 6, 0.15);
      top: 18px;
      left: 22px;
    }

    .moon::after {
      content: '';
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(212, 136, 6, 0.12);
      top: 48px;
      left: 50px;
    }

    /* Luces Bokeh Dinámicas en el fondo (fase inicial) */
    .orb {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(250, 219, 20, 0.6) 0%, rgba(250, 219, 20, 0) 70%);
      animation: floatOrb 8s infinite alternate ease-in-out;
    }

    @keyframes floatOrb {
      0% { transform: translateY(0) scale(1); opacity: 0.3; }
      100% { transform: translateY(-40px) scale(1.3); opacity: 0.7; }
    }

    /* Canvas de Partículas (Pétalos dorados y chispas) */
    canvas#particles {
      position: absolute;
      inset: 0;
      z-index: 7;
      pointer-events: none;
    }

    /* ==================================================
       PANTALLA DE INICIO (necesaria para permitir audio)
       ================================================== */
    .start-gate {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1.4rem;
      background: radial-gradient(circle at center, #1a1403 0%, #0b0801 100%);
      transition: opacity 1s ease, visibility 1s ease;
    }

    .start-gate.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .start-gate p {
      color: #ffe58f;
      font-size: 0.95rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.8;
      text-align: center;
      padding: 0 1.5rem;
    }

    .start-btn {
      padding: 0.9rem 2.2rem;
      border: none;
      border-radius: 999px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      color: #3d2500;
      background: linear-gradient(135deg, #fff566, #faad14);
      box-shadow: 0 10px 30px rgba(250, 173, 20, 0.4);
      cursor: pointer;
      animation: pulseBtn 2.2s ease-in-out infinite;
    }

    @keyframes pulseBtn {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* Control de sonido */
    .sound-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 40;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(6px);
      color: #fff8e1;
      font-size: 1.2rem;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }

    .sound-toggle.visible {
      display: flex;
    }

    .sound-toggle:hover {
      background: rgba(255, 255, 255, 0.32);
    }

    /* ==================================================
       FASE 1: El Girasol Inicial
       ================================================== */
    .intro-sunflower-container {
      position: absolute;
      z-index: 5;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 380px;
      height: 380px;
      filter: drop-shadow(0 0 35px rgba(250, 219, 20, 0.45));
    }

    .intro-sunflower-container.playing {
      animation:
        emergeSunflower 2.5s cubic-bezier(0.2, 0.9, 0.3, 1) forwards,
        rotateSunflower 7s linear infinite,
        dissolveSunflower 1s cubic-bezier(0.8, 0, 0.2, 1) 4.2s forwards;
    }

    @keyframes emergeSunflower {
      0% {
        transform: scale(0.1) translateY(80px);
        opacity: 0;
        filter: blur(15px);
      }
      60% {
        filter: blur(0px);
      }
      100% {
        transform: scale(1) translateY(0);
        opacity: 1;
      }
    }

    @keyframes rotateSunflower {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes dissolveSunflower {
      0% {
        transform: scale(1) rotate(210deg);
        opacity: 1;
        filter: blur(0px);
      }
      100% {
        transform: scale(1.6) rotate(260deg);
        opacity: 0;
        filter: blur(25px);
      }
    }

    .sunflower-svg {
      width: 100%;
      height: 100%;
    }

    /* ==================================================
       FASE 2: Prado de Flores Amarillas
       ================================================== */
    .field-container {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      opacity: 0;
      transition: opacity 3s ease;
    }

    .flower-stem {
      position: absolute;
      bottom: -20px;
      transform-origin: bottom center;
      display: flex;
      flex-direction: column;
      align-items: center;
      will-change: transform;
    }

    .leaf {
      position: absolute;
      background: linear-gradient(135deg, #73d13d, #389e0d);
      border-radius: 0 100% 0 100%;
    }

    .sway-breeze {
      animation: sway 5s ease-in-out infinite alternate;
    }

    .pulse-heartbeat {
      animation: heartbeat 3s ease-in-out infinite alternate;
    }

    @keyframes sway {
      0% { transform: rotate(-5deg); }
      100% { transform: rotate(6deg); }
    }

    @keyframes heartbeat {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(0.98); }
    }

    /* ==================================================
       FASE 4: Mensaje Central Estilizado
       ================================================== */
    .message-container {
      position: relative;
      z-index: 10;
      text-align: center;
      opacity: 0;
      transform: translateY(30px) scale(0.95);
      transition: all 2s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 2.5rem 3rem;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(14px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35),
                  0 0 0 1px rgba(255, 255, 255, 0.15);
      max-width: 90%;
    }

    .message-container.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .tagline {
      font-size: 1.1rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #ffe58f;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .title {
      font-family: 'Caveat', cursive;
      font-size: clamp(2.8rem, 7vw, 5.5rem);
      font-weight: 700;
      line-height: 1.1;
      background: linear-gradient(135deg, #ffe58f 0%, #faad14 40%, #fff566 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 30px rgba(250, 173, 20, 0.3);
    }

    .subtitle {
      margin-top: 1rem;
      font-size: 1.1rem;
      color: #fdf3d6;
      max-width: 480px;
    }

    .song-credit {
      margin-top: 0.8rem;
      font-size: 0.8rem;
      color: rgba(253, 243, 214, 0.65);
      letter-spacing: 0.5px;
    }

    /* Línea de letra sincronizada con la música */
    .lyric-line {
      position: absolute;
      left: 50%;
      bottom: 8%;
      transform: translateX(-50%) translateY(10px);
      z-index: 11;
      color: #fff8e1;
      font-size: clamp(1rem, 2.4vw, 1.4rem);
      font-weight: 600;
      text-align: center;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: opacity 0.6s ease, transform 0.6s ease;
      pointer-events: none;
      max-width: 90%;
    }

    .lyric-line.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Botón de repetición */
    .replay-btn {
      margin-top: 1.5rem;
      padding: 0.7rem 1.8rem;
      border: none;
      border-radius: 999px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      color: #3d2500;
      background: linear-gradient(135deg, #fff566, #faad14);
      box-shadow: 0 8px 20px rgba(212, 136, 6, 0.35);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      opacity: 0;
      pointer-events: none;
    }

    .message-container.visible .replay-btn {
      opacity: 1;
      pointer-events: auto;
      transition: opacity 1s ease 0.6s;
    }

    .replay-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(212, 136, 6, 0.45);
    }

    .replay-btn:active {
      transform: translateY(0);
    }

    /* Ajustes responsivos */
    @media (max-width: 768px) {
      .intro-sunflower-container {
        width: 260px;
        height: 260px;
      }
      .message-container {
        padding: 1.8rem;
      }
      .moon {
        width: 60px;
        height: 60px;
        top: 6%;
        right: 8%;
      }
    }

    /* Respeta la preferencia de movimiento reducido */
    @media (prefers-reduced-motion: reduce) {
      .intro-sunflower-container.playing {
        animation: emergeSunflower 1.5s ease forwards, dissolveSunflower 1s ease 3s forwards;
      }
      .sway-breeze, .pulse-heartbeat, .orb, .star, .start-btn {
        animation: none !important;
      }
      .message-container, .night-bg, .night-veil, .stars, .moon {
        transition: opacity 1.2s ease;
      }
    }
  </style>
</head>
<body>

<div class="viewport" id="stage">

  <!-- Pantalla de inicio: requerida por los navegadores para permitir audio con sonido -->
  <div class="start-gate" id="startGate">
    <p>Una experiencia con música<br>Toca para comenzar</p>
    <button class="start-btn" id="startBtn" type="button">🌻 Comenzar</button>
  </div>

  <!-- Control de silencio, visible una vez iniciada la experiencia -->
  <button class="sound-toggle" id="soundToggle" type="button" aria-label="Silenciar música">🔊</button>

  <!-- Fondo 1: Bokeh Inicial -->
  <div class="bokeh-bg" id="bokehBg">
    <div class="orb" style="width: 300px; height: 300px; left: 10%; top: 20%;"></div>
    <div class="orb" style="width: 250px; height: 250px; right: 15%; top: 50%; animation-delay: -3s;"></div>
    <div class="orb" style="width: 180px; height: 180px; left: 45%; bottom: 10%; animation-delay: -5s;"></div>
  </div>

  <!-- Fondo 2: Prado Cálido (de día) -->
  <div class="meadow-bg" id="meadowBg"></div>

  <!-- Fondo 3: Cielo nocturno (aparece cuando inicia la música) -->
  <div class="night-bg" id="nightBg"></div>
  <div class="night-veil" id="nightVeil"></div>
  <div class="stars" id="starsLayer"></div>
  <div class="moon" id="moon"></div>

  <!-- Fase 1: Girasol Inicial SVG -->
  <div class="intro-sunflower-container" id="introSunflower">
    <svg class="sunflower-svg" viewBox="0 0 200 200" role="img" aria-label="Girasol animado">
      <defs>
        <radialGradient id="sunflowerCore" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#3d1e03" />
          <stop offset="70%" stop-color="#5c2e0b" />
          <stop offset="100%" stop-color="#2d1302" />
        </radialGradient>
        <linearGradient id="petalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#FFF566" />
          <stop offset="60%" stop-color="#FADB14" />
          <stop offset="100%" stop-color="#D48806" />
        </linearGradient>
      </defs>

      <g transform="translate(100, 100)">
        <g id="petals">
          <path d="M 0,-25 Q -14,-60 0,-95 Q 14,-60 0,-25" fill="url(#petalGrad)" transform="rotate(0)" />
          <path d="M 0,-25 Q -14,-60 0,-95 Q 14,-60 0,-25" fill="url(#petalGrad)" transform="rotate(22.5)" />
          <path d="M 0,-25 Q -14,-60 0,-95 Q 14,-60 0,-25" fill="url(#petalGrad)" transform="rotate(45)" />
          <path d="M 0,-25 Q -14,-60 0,-95 Q 14,-60 0,-25" fill="url(#petalGrad)" transform="rotate(67.5)" />
          <path d="M 0,-25 Q -14,-60 0,-95 Q 14,-60 0,-25" fill="url(#petalGrad)" transform="rotate(90)" />
          <path d="M 0,-25 Q -14,-60 0,-95 Q 14,-60 0,-25" fill="url(#petalGrad)" transform="rotate(112.5)" />
          <path d="M 0,-25 Q -14,-60 0,-95 Q 14,-60 0,-25" fill="url(#petalGrad)" transform="rotate(135)" />
          <path d="M 0,-25 Q -14,-60 0,-95 Q 14,-60 0,-25" fill="url(#petalGrad)" transform="rotate(157.5)" />
          <path d="M 0,-25 Q -14,-60 0,-95 Q 14,-60 0,-25" fill="url(#petalGrad)" transform="rotate(180)" />
          <path d="M 0,-25 Q -14,-60 0,-95 Q 14,-60 0,-25" fill="url(#petalGrad)" transform="rotate(202.5)" />
          <path d="M 0,-25 Q -14,-60 0,-95 Q 14,-60 0,-25" fill="url(#petalGrad)" transform="rotate(225)" />
          <path d="M 0,-25 Q -14,-60 0,-95 Q 14,-60 0,-25" fill="url(#petalGrad)" transform="rotate(247.5)" />
          <path d="M 0,-25 Q -14,-60 0,-95 Q 14,-60 0,-25" fill="url(#petalGrad)" transform="rotate(270)" />
          <path d="M 0,-25 Q -14,-60 0,-95 Q 14,-60 0,-25" fill="url(#petalGrad)" transform="rotate(292.5)" />
          <path d="M 0,-25 Q -14,-60 0,-95 Q 14,-60 0,-25" fill="url(#petalGrad)" transform="rotate(315)" />
          <path d="M 0,-25 Q -14,-60 0,-95 Q 14,-60 0,-25" fill="url(#petalGrad)" transform="rotate(337.5)" />
        </g>

        <circle cx="0" cy="0" r="32" fill="url(#sunflowerCore)" />
        <circle cx="0" cy="0" r="28" fill="none" stroke="#683908" stroke-dasharray="3,3" stroke-width="2" />
        <circle cx="0" cy="0" r="18" fill="none" stroke="#faad14" stroke-dasharray="2,4" stroke-width="1.5" opacity="0.6"/>
      </g>
    </svg>
  </div>

  <!-- Fase 2: Prado dinámico con Margaritas y Tulipanes -->
  <div class="field-container" id="flowerField"></div>

  <!-- Canvas de Partículas (Eclosión y brisa de pétalos) -->
  <canvas id="particles" aria-hidden="true"></canvas>

  <!-- Línea de letra sincronizada (se completa por el usuario, ver JS) -->
  <div class="lyric-line" id="lyricLine"></div>

  <!-- Fase 4: Mensaje Final (aparece de noche, con la música sonando) -->
  <div class="message-container" id="message">
    <div class="tagline">Una promesa dorada</div>
    <h1 class="title">¡Feliz Día de las Flores Amarillas!</h1>
    <p class="subtitle">Que la alegría, la luz y los mejores momentos iluminen tu camino hoy y siempre.</p>
    <p class="song-credit">🎵 "Cuenta Conmigo" — Río Roma</p>
    <button class="replay-btn" id="replayBtn" type="button">Ver de nuevo</button>
  </div>

  <!--
    ============================================================
    AUDIO DE FONDO
    ============================================================
    Por derechos de autor, este archivo NO incluye la canción.
    Para activarla:
      1) Consigue el archivo de audio de "Cuenta Conmigo" de Río Roma
         de una fuente legítima donde tengas licencia de uso
         (compra digital, tu propia biblioteca, licencia comercial, etc).
      2) Colócalo junto a este HTML con el nombre "cuenta-conmigo.mp3"
         (o cambia el "src" de abajo por la ruta/URL que corresponda).
    Mientras no exista el archivo, el audio simplemente no sonará
    y la animación seguirá funcionando con normalidad.
  -->
  <audio id="bgMusic" preload="auto" loop>
    <source src="cuenta-conmigo.mp3" type="audio/mpeg">
  </audio>
</div>

<script>
  /* ==================================================
     CONFIGURACIÓN GENERAL
     ================================================== */
  const isMobile = window.innerWidth < 600;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const timers = [];
  const bgMusic = document.getElementById('bgMusic');
  let musicMuted = false;

  /* ==================================================
     SISTEMA DE PARTÍCULAS CANVAS (Brillo y Pétalos)
     ================================================== */
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let width, height;
  let particles = [];
  let gentleFallInterval = null;

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  class Particle {
    constructor(x, y, mode = 'burst') {
      this.x = x || Math.random() * width;
      this.y = y || (mode === 'burst' ? height / 2 : -20);
      this.mode = mode;

      if (mode === 'burst') {
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 2.2;
        const speed = 4 + Math.random() * 9;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.size = 10 + Math.random() * 16;
        this.alpha = 1;
        this.gravity = -0.05;
        this.drag = 0.985;
      } else {
        this.x = Math.random() * width;
        this.y = -30;
        this.vx = Math.sin(Math.random() * Math.PI) * 1.5;
        this.vy = 1 + Math.random() * 2.2;
        this.size = 8 + Math.random() * 10;
        this.alpha = 0.8;
        this.gravity = 0.01;
        this.drag = 0.99;
      }

      this.rotation = Math.random() * Math.PI * 2;
      this.vRot = (Math.random() - 0.5) * 0.08;
      this.color = Math.random() > 0.3 ? '#FADB14' : '#FFE58F';
    }

    update() {
      this.vx *= this.drag;
      this.vy += this.gravity;
      this.x += this.vx;
      this.y += this.vy;
      this.rotation += this.vRot;

      if (this.mode === 'burst') {
        this.alpha -= 0.007;
      } else {
        if (this.y > height + 40) {
          this.y = -30;
          this.x = Math.random() * width;
        }
      }
    }

    draw() {
      if (this.alpha <= 0) return;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rotation);
      ctx.globalAlpha = Math.max(this.alpha, 0);

      ctx.fillStyle = this.color;
      ctx.shadowBlur = 12;
      ctx.shadowColor = 'rgba(250, 219, 20, 0.4)';

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(this.size / 2, -this.size, 0, -this.size * 1.5);
      ctx.quadraticCurveTo(-this.size / 2, -this.size, 0, 0);
      ctx.fill();

      ctx.restore();
    }
  }

  function triggerBurst() {
    const burstCount = isMobile ? 80 : 140;
    const centerX = width / 2;
    const centerY = height / 2;
    for (let i = 0; i < burstCount; i++) {
      particles.push(new Particle(centerX, centerY, 'burst'));
    }
  }

  function initGentleFall() {
    const maxParticles = isMobile ? 45 : 90;
    gentleFallInterval = setInterval(() => {
      if (particles.length < maxParticles) {
        particles.push(new Particle(null, null, 'gentle'));
      }
    }, 250);
  }

  function animateParticles() {
    ctx.clearRect(0, 0, width, height);
    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update();
      particles[i].draw();
      if (particles[i].mode === 'burst' && particles[i].alpha <= 0) {
        particles.splice(i, 1);
      }
    }
    requestAnimationFrame(animateParticles);
  }

  /* ==================================================
     ESTRELLAS DEL CIELO NOCTURNO
     ================================================== */
  function createStars() {
    const layer = document.getElementById('starsLayer');
    layer.innerHTML = '';
    const count = isMobile ? 45 : 90;
    for (let i = 0; i < count; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      const size = 1 + Math.random() * 2.4;
      star.style.width = `${size}px`;
      star.style.height = `${size}px`;
      star.style.left = `${Math.random() * 100}%`;
      star.style.top = `${Math.random() * 70}%`;
      star.style.animationDelay = `${Math.random() * -3}s`;
      star.style.animationDuration = `${2 + Math.random() * 3}s`;
      layer.appendChild(star);
    }
  }

  /* ==================================================
     GENERACIÓN DINÁMICA DEL PRADO DE FLORES
     ================================================== */
  const flowerSVGs = {
    daisy: (color) => `
      <svg width="80" height="80" viewBox="0 0 100 100">
        <g transform="translate(50,50)">
          ${[0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330].map(deg =>
            `<ellipse cx="0" cy="-28" rx="8" ry="20" fill="${color}" transform="rotate(${deg})" opacity="0.95"/>`
          ).join('')}
          <circle cx="0" cy="0" r="14" fill="#D48806" />
        </g>
      </svg>
    `,
    tulip: (color) => `
      <svg width="70" height="80" viewBox="0 0 70 80">
        <path d="M35 15 C10 15, 10 65, 35 75 C60 65, 60 15, 35 15 Z" fill="${color}" />
        <path d="M35 25 C20 25, 15 50, 35 70 C55 50, 50 25, 35 25 Z" fill="#FFF566" opacity="0.7"/>
      </svg>
    `
  };

  function createMeadow() {
    const container = document.getElementById('flowerField');
    container.innerHTML = '';
    const flowersCount = Math.floor(window.innerWidth / 70);
    const flowerTypes = ['daisy', 'tulip'];
    const colors = ['#FFF566', '#FADB14', '#FFD666', '#FFF082'];

    for (let i = 0; i < flowersCount; i++) {
      const stemWrapper = document.createElement('div');
      stemWrapper.className = reduceMotion ? 'flower-stem' : 'flower-stem sway-breeze';

      const leftPos = (i / flowersCount) * 100 + (Math.random() * 4 - 2);
      const scale = 0.55 + Math.random() * 0.55;
      const zIndex = Math.floor(scale * 10);
      const delay = Math.random() * -6;

      stemWrapper.style.left = `${leftPos}%`;
      stemWrapper.style.zIndex = zIndex;
      stemWrapper.style.transform = `scale(${scale})`;
      stemWrapper.style.animationDelay = `${delay}s`;
      stemWrapper.style.animationDuration = `${4.5 + Math.random() * 2.5}s`;

      const heightStem = 80 + Math.random() * 120;
      const type = flowerTypes[Math.floor(Math.random() * flowerTypes.length)];
      const color = colors[Math.floor(Math.random() * colors.length)];
      const leafSide = Math.random() > 0.5 ? 1 : -1;
      const leafOffset = heightStem * 0.4;

      stemWrapper.innerHTML = `
        <div class="${reduceMotion ? '' : 'pulse-heartbeat'}" style="animation-delay: ${Math.random() * -3}s">
          ${flowerSVGs[type](color)}
        </div>
        <div style="position: relative; width: 5px; height: ${heightStem}px; background: linear-gradient(to bottom, #73d13d, #237804); border-radius: 4px; margin-top: -10px;">
          <div class="leaf" style="width: 22px; height: 14px; top: ${leafOffset}px; left: ${leafSide === 1 ? '3px' : '-20px'}; transform: rotate(${leafSide === 1 ? 20 : -20}deg);"></div>
        </div>
      `;

      container.appendChild(stemWrapper);
    }
  }

  /* ==================================================
     LETRA SINCRONIZADA (opcional)
     ================================================== */
  // Por derechos de autor no incluyo el texto de la letra aquí.
  // Si quieres mostrarla sincronizada, completa "text" en cada línea
  // con tu propia transcripción (por ejemplo, escuchando el audio que
  // subiste) y ajusta "start"/"end" (en segundos) a donde corresponda.
  // Deja "text": '' en las líneas que no quieras mostrar.
  const lyricCues = [
    { start: 0, end: 0, text: '' },
    { start: 0, end: 0, text: '' },
    { start: 0, end: 0, text: '' },
    { start: 0, end: 0, text: '' },
    { start: 0, end: 0, text: '' },
  ];

  const lyricEl = document.getElementById('lyricLine');
  let activeCue = null;

  bgMusic.addEventListener('timeupdate', () => {
    const t = bgMusic.currentTime;
    const cue = lyricCues.find(c => c.text && t >= c.start && t <= c.end);
    if (cue !== activeCue) {
      activeCue = cue || null;
      if (activeCue) {
        lyricEl.textContent = activeCue.text;
        lyricEl.classList.add('visible');
      } else {
        lyricEl.classList.remove('visible');
      }
    }
  });

  /* ==================================================
     MÚSICA Y TRANSICIÓN A MODO NOCHE
     ================================================== */
  function startNightAndMusic() {
    document.getElementById('nightBg').classList.add('active');
    document.getElementById('nightVeil').classList.add('active');
    document.getElementById('starsLayer').classList.add('active');
    document.getElementById('moon').classList.add('active');
    createStars();

    // Intentar reproducir la música justo cuando cae la noche.
    // Si el archivo cuenta-conmigo.mp3 no existe, esto falla en silencio
    // y la animación continúa sin sonido.
    bgMusic.currentTime = 0;
    bgMusic.volume = 0.85;
    const playPromise = bgMusic.play();
    if (playPromise && playPromise.catch) {
      playPromise
        .then(() => {
          document.getElementById('soundToggle').classList.add('visible');
        })
        .catch(() => {
          console.warn('No se pudo reproducir la música (¿falta el archivo de audio?).');
        });
    }
  }

  document.getElementById('soundToggle').addEventListener('click', () => {
    musicMuted = !musicMuted;
    bgMusic.muted = musicMuted;
    document.getElementById('soundToggle').textContent = musicMuted ? '🔇' : '🔊';
  });

  /* ==================================================
     ORQUESTADOR CINEMATOGRÁFICO DE ESCENAS
     ================================================== */
  function clearTimers() {
    timers.forEach(t => clearTimeout(t));
    timers.length = 0;
    if (gentleFallInterval) clearInterval(gentleFallInterval);
  }

  function resetScene() {
    clearTimers();
    particles = [];
    bgMusic.pause();
    bgMusic.currentTime = 0;

    const sunflower = document.getElementById('introSunflower');
    const meadowBg = document.getElementById('meadowBg');
    const bokehBg = document.getElementById('bokehBg');
    const flowerField = document.getElementById('flowerField');
    const message = document.getElementById('message');

    message.classList.remove('visible');
    flowerField.style.opacity = '0';
    flowerField.innerHTML = '';
    meadowBg.style.opacity = '0';
    bokehBg.style.opacity = '1';

    document.getElementById('nightBg').classList.remove('active');
    document.getElementById('nightVeil').classList.remove('active');
    document.getElementById('starsLayer').classList.remove('active');
    document.getElementById('moon').classList.remove('active');
    document.getElementById('soundToggle').classList.remove('visible');
    lyricEl.classList.remove('visible');
    activeCue = null;

    sunflower.style.display = 'flex';
    sunflower.classList.remove('playing');
    void sunflower.offsetWidth; // forzar reflow
    sunflower.classList.add('playing');
  }

  function runShow() {
    const sunflower = document.getElementById('introSunflower');
    const meadowBg = document.getElementById('meadowBg');
    const bokehBg = document.getElementById('bokehBg');
    const flowerField = document.getElementById('flowerField');
    const message = document.getElementById('message');

    sunflower.classList.add('playing');

    if (reduceMotion) {
      timers.push(setTimeout(() => {
        sunflower.style.display = 'none';
        meadowBg.style.opacity = '1';
        bokehBg.style.opacity = '0';
        createMeadow();
        flowerField.style.opacity = '1';
      }, 1200));

      timers.push(setTimeout(() => {
        startNightAndMusic();
      }, 2200));

      timers.push(setTimeout(() => {
        message.classList.add('visible');
      }, 2800));
      return;
    }

    // 1. Disolución del girasol: explosión dorada
    timers.push(setTimeout(() => {
      triggerBurst();
    }, 4100));

    // 2. Revelar el prado dorado, de día
    timers.push(setTimeout(() => {
      sunflower.style.display = 'none';
      meadowBg.style.opacity = '1';
      bokehBg.style.opacity = '0';
      createMeadow();
      flowerField.style.opacity = '1';
      initGentleFall();
    }, 4900));

    // 3. El prado respira un momento a la luz del día antes de anochecer
    timers.push(setTimeout(() => {
      startNightAndMusic();
    }, 7600));

    // 4. Aparición triunfal del mensaje, ya de noche con la música sonando
    timers.push(setTimeout(() => {
      message.classList.add('visible');
    }, 9200));
  }

  document.getElementById('startBtn').addEventListener('click', () => {
    document.getElementById('startGate').classList.add('hidden');
    runShow();
  });

  document.getElementById('replayBtn').addEventListener('click', () => {
    resetScene();
    requestAnimationFrame(() => runShow());
  });

  animateParticles();
</script>

</body>
</html>
