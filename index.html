
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>¡Feliz Día de las Flores Amarillas!</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold-deep: #D48806;
      --gold-vivid: #FADB14;
      --gold-light: #FFF566;
      --warm-bg-start: #FFFBE6;
      --warm-bg-end: #FFE58F;
      --night-start: #0b1230;
      --night-mid: #17235c;
      --night-glow: #3b4ea3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f0d05;
      font-family: 'Quicksand', sans-serif;
    }

    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .bokeh-bg {
      position: absolute;
      inset: -50px;
      background: radial-gradient(circle at 50% 50%, #442a04 0%, #1a1403 60%, #070601 100%);
      filter: blur(40px);
      z-index: 1;
      transition: opacity 3s ease;
    }

    .meadow-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #ffffff 0%, var(--warm-bg-start) 40%, var(--warm-bg-end) 100%);
      opacity: 0;
      z-index: 2;
      transition: opacity 2.5s ease-in-out;
    }

    .night-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 25%, var(--night-glow) 0%, var(--night-mid) 45%, var(--night-start) 100%);
      opacity: 0;
      z-index: 2;
      transition: opacity 3.5s ease-in-out;
      pointer-events: none;
    }
    .night-bg.active { opacity: 1; }

    .night-veil {
      position: absolute;
      inset: 0;
      background: rgba(11, 18, 48, 0.45);
      opacity: 0;
      z-index: 4;
      transition: opacity 3.5s ease-in-out;
      pointer-events: none;
    }
    .night-veil.active { opacity: 1; }

    .stars {
      position: absolute;
      inset: 0;
      z-index: 3;
      opacity: 0;
      transition: opacity 3s ease-in-out;
      pointer-events: none;
    }
    .stars.active { opacity: 1; }

    .star {
      position: absolute;
      border-radius: 50%;
      background: #fffef2;
      animation: twinkle 3s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.25; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    .moon {
      position: absolute;
      top: 8%;
      right: 12%;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fffdf0 0%, #fff3c4 55%, #ffe58f 100%);
      box-shadow: 0 0 50px 15px rgba(255, 245, 200, 0.4);
      z-index: 3;
      opacity: 0;
      transition: opacity 3s ease-in-out, transform 3s ease-in-out;
      transform: translateY(-20px);
      pointer-events: none;
    }
    .moon.active {
      opacity: 1;
      transform: translateY(0);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(250, 219, 20, 0.6) 0%, rgba(250, 219, 20, 0) 70%);
      animation: floatOrb 8s infinite alternate ease-in-out;
    }

    @keyframes floatOrb {
      0% { transform: translateY(0) scale(1); opacity: 0.3; }
      100% { transform: translateY(-40px) scale(1.3); opacity: 0.7; }
    }

    canvas#particles {
      position: absolute;
      inset: 0;
      z-index: 7;
      pointer-events: none;
    }

    /* Pantalla inicial */
    .start-gate {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1.2rem;
      background: radial-gradient(circle at center, #1a1403 0%, #0b0801 100%);
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    .start-gate.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .start-gate p {
      color: #ffe58f;
      font-size: 1.15rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.6;
    }
    .start-btn {
      padding: 1rem 2.8rem;
      border: none;
      border-radius: 999px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
      color: #3d2500;
      background: linear-gradient(135deg, #fff566, #faad14);
      box-shadow: 0 10px 30px rgba(250, 173, 20, 0.4);
      cursor: pointer;
      animation: pulseBtn 2s ease-in-out infinite;
    }

    .file-select-label {
      font-size: 0.82rem;
      color: #ffd591;
      text-decoration: underline;
      cursor: pointer;
      opacity: 0.8;
      margin-top: 5px;
    }

    @keyframes pulseBtn {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    /* Fase 1: Girasol */
    .intro-sunflower-container {
      position: absolute;
      z-index: 5;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 340px;
      height: 340px;
      filter: drop-shadow(0 0 35px rgba(250, 219, 20, 0.5));
      pointer-events: none;
    }
    .intro-sunflower-container.playing {
      animation:
        emergeSunflower 2.5s cubic-bezier(0.2, 0.9, 0.3, 1) forwards,
        rotateSunflower 7s linear infinite,
        dissolveSunflower 1s cubic-bezier(0.8, 0, 0.2, 1) 4.2s forwards;
    }

    @keyframes emergeSunflower {
      0% { transform: scale(0.1) translateY(80px); opacity: 0; filter: blur(15px); }
      100% { transform: scale(1) translateY(0); opacity: 1; filter: blur(0px); }
    }
    @keyframes rotateSunflower {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes dissolveSunflower {
      0% { transform: scale(1) rotate(210deg); opacity: 1; filter: blur(0px); }
      100% { transform: scale(1.6) rotate(260deg); opacity: 0; filter: blur(25px); }
    }

    .sunflower-svg { width: 100%; height: 100%; }

    /* Fase 2: Prado */
    .field-container {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      opacity: 0;
      transition: opacity 2.5s ease;
    }
    .flower-stem {
      position: absolute;
      bottom: -20px;
      transform-origin: bottom center;
      display: flex;
      flex-direction: column;
      align-items: center;
      will-change: transform;
    }
    .leaf {
      position: absolute;
      background: linear-gradient(135deg, #73d13d, #389e0d);
      border-radius: 0 100% 0 100%;
    }
    .sway-breeze { animation: sway 5s ease-in-out infinite alternate; }
    .pulse-heartbeat { animation: heartbeat 3s ease-in-out infinite alternate; }

    @keyframes sway {
      0% { transform: rotate(-5deg); }
      100% { transform: rotate(6deg); }
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* Subtítulos Amarillos */
    .lyric-line {
      position: absolute;
      top: 24%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      z-index: 15;
      color: #fff466;
      font-family: 'Quicksand', sans-serif;
      font-size: clamp(1.4rem, 4vw, 2.3rem);
      font-weight: 700;
      text-align: center;
      text-shadow: 0 0 14px rgba(250, 219, 20, 0.9),
                   0 0 28px rgba(212, 136, 6, 0.7),
                   0 4px 12px rgba(0, 0, 0, 0.85);
      opacity: 0;
      transition: opacity 0.35s ease, transform 0.35s ease;
      pointer-events: none;
      max-width: 85%;
      line-height: 1.35;
    }
    .lyric-line.visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .hint-tap {
      position: absolute;
      bottom: 25px;
      z-index: 20;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #ffe58f;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }
    .hint-tap.show { opacity: 0.65; }

    /* ==================================================
       MENSAJE FINAL Y DEDICATORIA DE ADRIÁN
       ================================================== */
    .message-container {
      position: relative;
      z-index: 25;
      text-align: center;
      opacity: 0;
      transform: translateY(30px) scale(0.9);
      transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 2.2rem 2.8rem;
      border-radius: 28px;
      background: rgba(15, 20, 35, 0.82);
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7),
                  0 0 0 1px rgba(255, 235, 143, 0.35);
      max-width: 90%;
      pointer-events: none;
    }
    .message-container.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    .tagline {
      font-size: 1.1rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #ffe58f;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }
    .title {
      font-family: 'Caveat', cursive;
      font-size: clamp(2.8rem, 6.5vw, 5rem);
      font-weight: 700;
      line-height: 1.1;
      background: linear-gradient(135deg, #fff566 0%, #faad14 45%, #ffd666 90%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 30px rgba(250, 173, 20, 0.4);
    }
    .subtitle {
      margin-top: 0.8rem;
      font-size: 1.1rem;
      color: #fdf3d6;
      max-width: 480px;
    }

    /* Caja especial: Muñeco de Adrián con Corazón */
    .author-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 1.4rem;
      padding: 0.6rem 1.4rem;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50px;
      border: 1px solid rgba(255, 245, 102, 0.25);
    }

    .cute-character {
      width: 46px;
      height: 46px;
      animation: charFloat 3s ease-in-out infinite alternate;
    }

    @keyframes charFloat {
      0% { transform: translateY(0px) rotate(-3deg); }
      100% { transform: translateY(-5px) rotate(3deg); }
    }

    .beating-heart {
      animation: heartPulse 1.2s infinite ease-in-out;
      transform-origin: 32px 30px;
    }

    @keyframes heartPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .author-text {
      display: flex;
      flex-direction: column;
      text-align: left;
    }
    .author-name {
      font-family: 'Caveat', cursive;
      font-size: 1.6rem;
      color: #FFF566;
      line-height: 1;
      text-shadow: 0 0 10px rgba(250, 219, 20, 0.5);
    }
    .author-sub {
      font-size: 0.82rem;
      color: #ffe58f;
      opacity: 0.9;
    }

    .replay-btn {
      margin-top: 1.2rem;
      padding: 0.75rem 2rem;
      border: none;
      border-radius: 999px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      color: #3d2500;
      background: linear-gradient(135deg, #fff566, #faad14);
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(212, 136, 6, 0.35);
    }
  </style>
</head>
<body>

<div class="viewport" id="stage">

  <div class="start-gate" id="startGate">
    <p>Día de las Flores Amarillas<br>Experiencia Especial</p>
    <button class="start-btn" id="startBtn" type="button">🌻 Toca para Iniciar</button>
    <label class="file-select-label">
      ¿Tienes el archivo MP3 en tu equipo? Haz clic aquí para seleccionarlo directamente
      <input type="file" id="audioFileInput" accept="audio/*" style="display: none;">
    </label>
  </div>

  <div class="bokeh-bg" id="bokehBg">
    <div class="orb" style="width: 300px; height: 300px; left: 10%; top: 20%;"></div>
    <div class="orb" style="width: 250px; height: 250px; right: 15%; top: 50%; animation-delay: -3s;"></div>
  </div>

  <div class="meadow-bg" id="meadowBg"></div>
  <div class="night-bg" id="nightBg"></div>
  <div class="night-veil" id="nightVeil"></div>
  <div class="stars" id="starsLayer"></div>
  <div class="moon" id="moon"></div>

  <!-- Girasol -->

        <circle cx="0" cy="0" r="18" fill="none" stroke="#faad14" stroke-dasharray="2,4" stroke-width="1.5" opacity="0.6"/>

  </div>

  <div class="field-container" id="flowerField"></div>

  <!-- Subtítulos -->

  <!-- Mensaje Final con Muñeco de Adrián -->

        <!-- Ojos sonrientes -->

      <div class="author-text">

    <button class="replay-btn" id="replayBtn" type="button">Volver a vivirlo</button>
  </div>

  <audio id="bgMusic" src="cuenta-conmigo.mp3" preload="auto"></audio>

</div>

  /* PARTÍCULAS LENTAS */
  const canvas = document.getElementById('particles');

  let width, height;
  let particles = [];
  let gentleFallInterval = null;

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  class Particle {

      this.mode = mode;

      if (mode === 'burst') {
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 2.2;
        const speed = 2.5 + Math.random() * 4.5;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.size = 10 + Math.random() * 14;
        this.alpha = 1;
        this.gravity = -0.02;
        this.drag = 0.985;
      } else {
        this.x = Math.random() * width;
        this.y = -30;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = 0.3 + Math.random() * 0.4;
        this.size = 9 + Math.random() * 11;
        this.alpha = 0.85;
        this.gravity = 0.001;
        this.drag = 0.998;
      }

      this.rotation = Math.random() * Math.PI * 2;
      this.vRot = (Math.random() - 0.5) * 0.03;
      this.color = Math.random() > 0.3 ? '#FADB14' : '#FFE58F';
    }

    update() {
      this.vx *= this.drag;
      this.vy += this.gravity;
      this.x += this.vx;
      this.y += this.vy;
      this.rotation += this.vRot;

      if (this.mode === 'burst') {
        this.alpha -= 0.006;
      } else if (this.y > height + 40) {
        this.y = -30;
        this.x = Math.random() * width;
        this.vy = 0.3 + Math.random() * 0.4;
      }
    }

    draw() {
      if (this.alpha <= 0) return;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rotation);
      ctx.globalAlpha = Math.max(this.alpha, 0);
      ctx.fillStyle = this.color;
      ctx.shadowBlur = 10;
      ctx.shadowColor = 'rgba(250, 219, 20, 0.4)';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(this.size / 2, -this.size, 0, -this.size * 1.5);
      ctx.quadraticCurveTo(-this.size / 2, -this.size, 0, 0);
      ctx.fill();
      ctx.restore();
    }
  }

  function triggerBurst() {
    for (let i = 0; i < 90; i++) {
      particles.push(new Particle(width / 2, height / 2, 'burst'));
    }
  }

  function initGentleFall() {
    gentleFallInterval = setInterval(() => {
      if (particles.length < 60) {
        particles.push(new Particle(null, null, 'gentle'));
      }
    }, 450);
  }

  function animateParticles() {
    ctx.clearRect(0, 0, width, height);
    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update();
      particles[i].draw();
      if (particles[i].mode === 'burst' && particles[i].alpha <= 0) {
        particles.splice(i, 1);
      }
    }
    requestAnimationFrame(animateParticles);
  }
  animateParticles();

  /* GENERACIÓN DE FLORES */
  function createStars() {
    const layer = document.getElementById('starsLayer');
    layer.innerHTML = '';
    for (let i = 0; i < 60; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      const size = 1 + Math.random() * 2;
      star.style.width = `${size}px`;
      star.style.height = `${size}px`;
      star.style.left = `${Math.random() * 100}%`;
      star.style.top = `${Math.random() * 70}%`;
      star.style.animationDelay = `${Math.random() * -3}s`;
      layer.appendChild(star);
    }
  }

  const flowerSVGs = {
    daisy: (color) => `
      <svg width="80" height="80" viewBox="0 0 100 100">
        <g transform="translate(50,50)">
          ${[0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330].map(deg =>
            `<ellipse cx="0" cy="-28" rx="8" ry="20" fill="${color}" transform="rotate(${deg})" opacity="0.95"/>`
          ).join('')}
          <circle cx="0" cy="0" r="14" fill="#D48806" />
        </g>
      </svg>
    `,
    tulip: (color) => `
      <svg width="70" height="80" viewBox="0 0 70 80">
        <path d="M35 15 C10 15, 10 65, 35 75 C60 65, 60 15, 35 15 Z" fill="${color}" />
        <path d="M35 25 C20 25, 15 50, 35 70 C55 50, 50 25, 35 25 Z" fill="#FFF566" opacity="0.7"/>
      </svg>
    `
  };

  function createMeadow() {
    const container = document.getElementById('flowerField');
    container.innerHTML = '';
    const flowersCount = Math.floor(window.innerWidth / 75);
    const flowerTypes = ['daisy', 'tulip'];
    const colors = ['#FFF566', '#FADB14', '#FFD666', '#FFF082'];

    for (let i = 0; i < flowersCount; i++) {
      const stemWrapper = document.createElement('div');
      stemWrapper.className = 'flower-stem sway-breeze';

      const leftPos = (i / flowersCount) * 100 + (Math.random() * 4 - 2);
      const scale = 0.55 + Math.random() * 0.55;
      const heightStem = 80 + Math.random() * 120;
      const type = flowerTypes[Math.floor(Math.random() * flowerTypes.length)];
      const color = colors[Math.floor(Math.random() * colors.length)];
      const leafSide = Math.random() > 0.5 ? 1 : -1;

      stemWrapper.style.left = `${leftPos}%`;
      stemWrapper.style.zIndex = Math.floor(scale * 10);
      stemWrapper.style.transform = `scale(${scale})`;
      stemWrapper.style.animationDelay = `${Math.random() * -6}s`;

      stemWrapper.innerHTML = `
        <div class="pulse-heartbeat" style="animation-delay: ${Math.random() * -3}s">
          ${flowerSVGs[type](color)}
        </div>
        <div style="position: relative; width: 5px; height: ${heightStem}px; background: linear-gradient(to bottom, #73d13d, #237804); border-radius: 4px; margin-top: -10px;">
          <div class="leaf" style="width: 22px; height: 14px; top: ${heightStem * 0.4}px; left: ${leafSide === 1 ? '3px' : '-20px'}; transform: rotate(${leafSide === 1 ? 20 : -20}deg);"></div>
        </div>
      `;
      container.appendChild(stemWrapper);
    }
  }

  /* SUBTÍTULOS Y AUDIO */
  const bgMusic = document.getElementById('bgMusic');
  const lyricEl = document.getElementById('lyricLine');
  let activeCue = null;
  let lyricsTimer = null;
  let songStartTime = null;

  document.getElementById('audioFileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      bgMusic.src = URL.createObjectURL(file);
      document.querySelector('.file-select-label').textContent = '✅ Música cargada: ' + file.name;
    }
  });

  function startLyricsClock() {
    songStartTime = Date.now();
    lyricsTimer = setInterval(() => {
      if (isMessageShown) return;

      let currentTime = (Date.now() - songStartTime) / 1000;
      if (!bgMusic.paused && bgMusic.currentTime > 0) {
        currentTime = bgMusic.currentTime;
      }

      const cue = lyricCues.find(c => currentTime >= c.start && currentTime <= c.end);
      if (cue !== activeCue) {
        activeCue = cue || null;
        if (activeCue) {
          lyricEl.textContent = activeCue.text;
          lyricEl.classList.add('visible');
        } else {
          lyricEl.classList.remove('visible');
        }
      }
    }, 200);
  }

  /* MENSAJE FINAL Y DOBLE PULSACIÓN */
  let isMessageShown = false;

  function showFinalMessage() {
    if (isMessageShown) return;
    isMessageShown = true;

    if (lyricsTimer) clearInterval(lyricsTimer);
    lyricEl.classList.remove('visible');
    document.getElementById('hintTap').classList.remove('show');

    const message = document.getElementById('message');
    message.classList.add('visible');
  }

  let lastTap = 0;
  function handleDblAction(e) {
    if (e.target.closest('#startBtn') || e.target.closest('#replayBtn') || e.target.closest('.file-select-label')) return;

    const now = Date.now();
    if (now - lastTap < 400 && now - lastTap > 0) {
      showFinalMessage();
    }
    lastTap = now;
  }
  window.addEventListener('click', handleDblAction);
  window.addEventListener('touchend', handleDblAction);

  /* SECUENCIA PRINCIPAL */
  const timers = [];

  function startExperience() {
    const sunflower = document.getElementById('introSunflower');
    const meadowBg = document.getElementById('meadowBg');
    const bokehBg = document.getElementById('bokehBg');
    const flowerField = document.getElementById('flowerField');

    sunflower.classList.add('playing');

    timers.push(setTimeout(() => {
      triggerBurst();
    }, 4100));

    timers.push(setTimeout(() => {
      sunflower.style.display = 'none';

      bgMusic.volume = 1.0;
      bgMusic.play().catch(() => {});

      meadowBg.style.opacity = '1';
      bokehBg.style.opacity = '0';
      createMeadow();
      flowerField.style.opacity = '1';
      initGentleFall();

      document.getElementById('nightBg').classList.add('active');
      document.getElementById('nightVeil').classList.add('active');
      document.getElementById('starsLayer').classList.add('active');
      document.getElementById('moon').classList.add('active');
      createStars();

      document.getElementById('hintTap').classList.add('show');
    }, 4900));

    timers.push(setTimeout(() => {
      startLyricsClock();
    }, 7900));
  }

  function resetScene() {
    timers.forEach(t => clearTimeout(t));
    timers.length = 0;
    if (gentleFallInterval) clearInterval(gentleFallInterval);
    if (lyricsTimer) clearInterval(lyricsTimer);

    particles = [];
    isMessageShown = false;
    activeCue = null;

    bgMusic.pause();
    bgMusic.currentTime = 0;

    const sunflower = document.getElementById('introSunflower');
    const meadowBg = document.getElementById('meadowBg');
    const bokehBg = document.getElementById('bokehBg');
    const flowerField = document.getElementById('flowerField');
    const message = document.getElementById('message');

    message.classList.remove('visible');
    document.getElementById('hintTap').classList.remove('show');
    lyricEl.classList.remove('visible');

    flowerField.style.opacity = '0';
    flowerField.innerHTML = '';
    meadowBg.style.opacity = '0';
    bokehBg.style.opacity = '1';

    document.getElementById('nightBg').classList.remove('active');
    document.getElementById('nightVeil').classList.remove('active');
    document.getElementById('starsLayer').classList.remove('active');
    document.getElementById('moon').classList.remove('active');

    sunflower.style.display = 'flex';
    sunflower.classList.remove('playing');
    void sunflower.offsetWidth;
    startExperience();
  }

  document.getElementById('startBtn').addEventListener('click', () => {
    bgMusic.play().then(() => {
      bgMusic.pause();
      bgMusic.currentTime = 0;
    }).catch(() => {});

    document.getElementById('startGate').classList.add('hidden');
    startExperience();
  });

  document.getElementById('replayBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    resetScene();
  });
</script>

</body>
